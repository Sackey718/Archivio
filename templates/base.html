<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archivio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand-wrap">
            <a class="brand" href="{{ url_for('dashboard') }}">
                <img src="{{ url_for('static', filename='Archivio_icon_light.png') }}" alt="Archivio" class="brand-icon">
                <span>Archivio</span>
            </a>
        </div>
        <nav class="nav">
            <a href="{{ url_for('dashboard') }}">ダッシュボード</a>
            <a href="{{ url_for('work_list') }}">作品一覧</a>
            <a href="{{ url_for('work_new') }}">新規登録</a>
            <a href="{{ url_for('work_bulk_add') }}">一括追加</a>
            <a href="{{ url_for('tag_list') }}">タグ</a>
            <a href="{{ url_for('series_list') }}">シリーズ</a>
            <a href="{{ url_for('people_list') }}">人物</a>
            <a href="{{ url_for('settings') }}">設定</a>
        </nav>
    </header>

    {% if sync_warning %}
        <div class="alert danger">
            {{ sync_warning }}
        </div>
    {% endif %}

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-list">
                {% for message in messages %}
                    <div class="alert info">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
